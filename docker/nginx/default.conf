server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    client_max_body_size 20M;

    # Enrutamiento estandar de Laravel: todo lo que no sea un archivo real
    # cae en index.php.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Ejecucion de PHP via FastCGI contra el contenedor de la app (php-fpm).
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    # Permitir /.well-known (ACME, etc.) pero negar el resto de ocultos.
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Nota: los headers de seguridad NO van aqui. Se implementan como
    # middleware de Laravel para que queden versionados y verificables.
}
