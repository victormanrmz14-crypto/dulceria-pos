name: Deploy

# AWS pulls CI-approved main commits. This hosted job confirms the live release.
# No production runner, SSH key, or AWS credential is exposed to GitHub jobs.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
      DEPLOY_URL: https://13.184.138.10
    steps:
      - name: Checkout the CI-approved revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Confirm deployment and health in AWS
        run: python3 deploy/lightsail/wait-for-release.py
